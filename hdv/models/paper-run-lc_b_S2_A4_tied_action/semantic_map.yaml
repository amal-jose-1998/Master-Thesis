label_rules:
  model: tied_action_lc_B
  unknown_z: -1
  S: 2
  A: 4


  thresholds:
    # ---------------------------------------------------------
    # Style / interaction context
    # ---------------------------------------------------------
    high_interaction_front_exists: 0.80
    low_interaction_front_exists_max: 0.65

    high_interaction_front_dx_max: 70.0
    low_interaction_front_dx_min: 100.0

    high_interaction_thw_max: 3.0

    # ---------------------------------------------------------
    # Braking 
    # ---------------------------------------------------------
    brake_ax_neg_frac: 0.90
    brake_ax_last: -0.15
    brake_vx_slope: -0.006

    # ---------------------------------------------------------
    # Acceleration 
    # ---------------------------------------------------------
    accel_ax_pos_frac: 0.90
    accel_ax_last: 0.15
    accel_vx_slope: 0.005

    # ---------------------------------------------------------
    # Lane-change
    # ---------------------------------------------------------
    lane_change_lc_present: 0.10
    lane_change_vy_std: 0.50
    lane_change_d_left_min_max: 1.30
    lane_change_d_right_min_max: 1.30

    # ---------------------------------------------------------
    # Cruising
    # ---------------------------------------------------------
    cruise_vx_slope_abs_max: 0.005
    cruise_ax_last_abs_max: 0.12
    cruise_ax_neg_frac_min: 0.45
    cruise_ax_neg_frac_max: 0.75
    cruise_ax_pos_frac_min: 0.20
    cruise_ax_pos_frac_max: 0.55

  priority:
    - action_3_lane_change
    - action_1_braking
    - action_2_acceleration
    - action_0_cruising
    - unknown

  style_decision:
    s0:
      any_of:
        - "front_exists_frac < low_interaction_front_exists_max"
        - "front_dx_min > low_interaction_front_dx_min"

    s1:
      any_of:
        - "front_exists_frac >= high_interaction_front_exists"
        - all_of:
            - "front_dx_min <= high_interaction_front_dx_max"
            - "front_thw_last <= high_interaction_thw_max"

  action_decision:
    a1:
      all_of:
        - "ax_neg_frac >= brake_ax_neg_frac"
        - "ax_last <= brake_ax_last"
      optional_support:
        - "vx_slope <= brake_vx_slope"

    a2:
      all_of:
        - "ax_pos_frac >= accel_ax_pos_frac"
        - "ax_last >= accel_ax_last"
        - "vx_slope >= accel_vx_slope"

    a3:
      all_of:
        - "vy_last_std >= lane_change_vy_std"
        - any_of:
            - "lc_left_present >= lane_change_lc_present"
            - "lc_right_present >= lane_change_lc_present"
            - "d_left_lane_min <= lane_change_d_left_min_max"
            - "d_right_lane_min <= lane_change_d_right_min_max"

    a0:
      all_of:
        - "abs(vx_slope) <= cruise_vx_slope_abs_max"
        - "abs(ax_last) <= cruise_ax_last_abs_max"
        - "ax_neg_frac >= cruise_ax_neg_frac_min"
        - "ax_neg_frac <= cruise_ax_neg_frac_max"
        - "ax_pos_frac >= cruise_ax_pos_frac_min"
        - "ax_pos_frac <= cruise_ax_pos_frac_max"


styles:
  s0:
    name: low_interaction
    description:
      Higher-speed and lower-interaction driving regime. A front vehicle is not always present, the front gap is usually large, and the ego vehicle is less constrained by a close leader.

  s1:
    name: high_interaction
    description:
      Constrained or car-following driving regime. A front vehicle is usually present, the front distance is shorter, and the ego vehicle is more strongly coupled to nearby traffic.


actions:
  a0:
    name: cruising
    description:
      Almost constant-speed driving. The longitudinal acceleration is close to zero, with only small positive and negative changes. This is not clear braking and not clear acceleration.

  a1:
    name: braking
    description:
      Sustained braking or speed reduction. The longitudinal acceleration is clearly negative, the speed slope is negative, and ax_neg_frac is close to 1.0.

  a2:
    name: acceleration
    description:
      Sustained acceleration. The longitudinal acceleration is clearly positive, the speed slope is positive, and ax_pos_frac is close to 1.0.

  a3:
    name: lane_change_lateral_maneuver
    description:
      Lateral maneuver behavior. The state has high lateral velocity variation, stronger lane-change evidence, and smaller minimum distance to lane boundaries.
      The longitudinal acceleration is close to zero, so it is not mainly a braking or acceleration state.


actions_by_style:
  s0:
    a0:
      name: cruising
      description:
        Cruising in a low-interaction context. The vehicle keeps almost constant speed while having weak interaction with a close front vehicle.

    a1:
      name: braking
      description:
        Braking in a low-interaction context. The vehicle slows down, but the front interaction is weaker than in the high-interaction style.

    a2:
      name: acceleration
      description:
        Acceleration in a low-interaction context. The vehicle speeds up while usually having a larger front gap and less constraint from surrounding traffic.

    a3:
      name: lane_change
      description:
        Lane-change or lateral maneuver in a low-interaction context. This state has lateral motion and lane-boundary evidence, but appears in a smaller part of the data.

  s1:
    a0:
      name: cruising
      description:
        Cruising in a high-interaction context. The vehicle keeps almost constant speed while a front vehicle is usually present.

    a1:
      name: braking
      description:
        Braking in a high-interaction context. The vehicle slows down while being more strongly affected by a closer front vehicle.

    a2:
      name: acceleration
      description:
        Acceleration in a high-interaction context. The vehicle speeds up while still driving in a more constrained traffic situation.

    a3:
      name: lane_change
      description:
        Lane-change or lateral maneuver in a high-interaction context. The vehicle shows strong lateral motion while nearby traffic and a closer front vehicle are often present.


other_cases:
  unknown:
    description:
      No clear rule matched.
    condition:
      - no_other_condition_matched